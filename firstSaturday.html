<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        body{
            background-color: crimson;
        }
        .box1{
            background-color: chartreuse;
            width: 200px;
            height: 200px;
        }
        .parent p{
            background-color: deeppink;
            color: white;
        }
    </style>
</head>
<body>
    styling(inline,internal,external)
    internal(style tag(opening and closing tag) inside the head tag)
    selector(universal selector(*),simple selectors(tagname,class,id),combinator selector,psuedo-class,psuedo-element,attributes)
    <div class="box1"></div>
    <div id="box1"></div>
    <h1></h1>
    <!-- container tags -->
    div,section,nav,aside,footer,main,header
    <div class="parent">
        <p>showp</p>
        <h1>showh1</h1>
        <input type="text"></h1>
    </div>
</body>
</html>
