<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        center{
            /* box-shadow: 5px 5px 5px plum; */
            filter: drop-shadow(12,212 ,5px);
        }
    </style>
</head>
<body>
    <div style="margin: auto; background: linear-gradient(purple,orangered); width: 500px; border-radius: 20px; margin-top: 25px;">
        <center>
            <h1 style="color: white;">Sign up</h1>
            <br>
            <p style="color: gray;">Create your account</p>
            <br>
            <form >
                <div>
                    <input type="text" placeholder="Username" style="background-color: white; border-radius: 20px; width: 300px; border: 0; padding: 12px 3px; outline: none;">
                </div>
                <br>
                <div>
                    <input type="text" placeholder="Email" style="background-color: white; border-radius: 20px; width: 300px; border: 0; height: 40px; padding-left: 5px;">
                </div>
                <br>
                <div>
                    <input type="password" placeholder="Password" style="background-color: white; border-radius: 20px; width: 300px; border: 0; height: 40px; padding-left: 5px;">
                </div>
                <br>
                <div>
                    <input type="password" placeholder="ConfirmPassword" style="background-color: white; border-radius: 20px; width: 300px; border: 0; height: 40px; padding-left: 5px;">
                </div>
                <br>
                <button style="background-color: plum; border-radius: 20px; width: 300px; height: 40px; border: 0; font-size: 16px; color: white;">Sign Up</button>
                <br>
                <br>
                <p>Or</p>
                <br>
                <button style="outline: 2px solid purple; border-radius: 20px; width: 300px; height: 40px; border: 0; font-size: 16px; color: purple;">Sign Up</button>
                <br>
                <br>
                <span>Already have an Account?</span>
                <a href="intro.html">Login</a>
                <br>
                <br>
            </form>
        </center>
        
    </div>
</body>
</html>
