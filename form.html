<!DOCTYPE html>
<html>
    <head>
        <title>Form</title>
    </head>
    <body>
        <div>Form</div>
        <center>
            <form style="background: linear-gradient(pink, plum); width: 600px; border-radius: 20px;">
                <h1>Sign up</h1>
                <div>
                    <label for="firstname">Firstname</label>
                    <br>
                    <input type="text" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <label for="lastname">Lastname</label>
                    <br>
                    <input type="text" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <label for="email">Email</label>
                    <br>
                    <input type="email" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <label for="date of birth">D.O.B</label>
                    <br>
                    <input type="date" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <label for="country">Country</label>
                    <select name="" id="">
                        <option value="">country</option>
                        <option value="">Togolaise</option>
                        <option value="">Ghanian</option>
                        <option value="">American</option>
                        <option value="">Others</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="language">Select Language</label>
                    <select name="" id="">
                        <option value="">language</option>
                        <option value="">Arabic</option>
                        <option value="">English</option>
                        <option value="">French</option>
                        <option value="">Others</option>
                    </select>
                </div>
                <br>
                <div>
                    <label for="password">Password</label>
                    <br>
                    <input type="password" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <label for="confirm-password">Confirm-Password</label>
                    <br>
                    <input type="password" style="border: none; outline: none; border-bottom: 2px solid black;">
                </div>
                <br>
                <div>
                    <input type="checkbox" name="" id="">
                    <span>agree to terms & conditions</span>
                </div>
                <br>
                <button>
                    <a href="Signin.html">Sign up</a>
                </button>
            </form>
        </center>
    </body>
</html>
