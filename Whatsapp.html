<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/81f35a7969.js" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .iphone-frame{
            border: 10px solid black;
            width: 350px;
            height: 550px;
            border-radius: 20px;
            margin: auto;
            position: relative;
        }
        footer{
            background-color: bisque;
            position: absolute;
            bottom: 0;
            display: flex;
            justify-content: space-around;
            width: 350px;
            border-radius: 0 0 10px 10px;
        }
        button{
            background-color: transparent;
            border: 0;
        }
        p{
            font-size: 10px;
        }
        .one{
            padding: 3px 0;
        }
        .section-four,.section-five,.section-three,.section-two,.section-one{
            width: 100%;
            height: 520px;
            background-color: brown;
            position: absolute;
            bottom: 100%;
            left: 0;
            border-radius:  10px 10px 0 0;
            overflow: auto;
        }
        .section-one{
            background-color: blueviolet;
            display: none;
        }
        .section-two{
            background-color: blue;
            display: none;
        }
        .section-three{
            background-color: rebeccapurple;
            display: none;
        }
        .section-five{
            background-color: chartreuse;
            display: none;
        }
        #one:focus .section-one, #two:focus .section-two, #three:focus .section-three,#four:focus .section-four,#five:focus .section-five{
            display: block;
            z-index: 1;
        }
    </style>
</head>
<body>
    <div class="iphone-frame">
        <footer>
            <button id="one">
                <div class="one">
                    <i class="fa-solid fa-spinner"></i>
                    <p>status</p>
                </div>
                <section class="section-one">
                    <p>status</p>
                </section>
            </button>
            <button id="two">
                <div class="one">
                    <i class="fa-solid fa-spinner"></i>
                    <p>status</p>
                </div>
                <section class="section-two">
                    <p>call</p>
                </section>
            </button>
            <button id="three">
                <div class="one">
                    <i class="fa-solid fa-spinner"></i>
                    <p>status</p>
                </div>
                <section class="section-three">
                    <p>community</p>
                </section>
            </button>
            <button id="four">
                <div class="one">
                    <i class="fa-solid fa-spinner"></i>
                    <p>status</p>
                </div>
                <section class="section-four">
                    <p>chat</p>
                </section>
            </button>
            <button id="five">
                <div class="one">
                    <i class="fa-solid fa-spinner"></i>
                    <p>status</p>
                </div>
                <section class="section-five">
                    <p>settings</p>
                </section>
            </button>
        </footer>
    </div>
</body>
</html>
