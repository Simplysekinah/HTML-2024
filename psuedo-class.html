<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        a{
            color: pink;
            text-decoration: none;
        }
        a:link{
            color: red;
        }
        a:visited{
            color: rebeccapurple;
        }
        a:hover{
            color: orangered;
        }
        .box{
            width: 200px;
            height: 200px;
            background-color: orange;
            transition-duration: 2s;
            transition-property: all;
            transition-delay: 0.5s;
            transition-timing-function: ease-in-out;
        }
        .box:hover{
            background-color: pink;
            width: 100px;
            rotate: 30deg;
        }
        .box:active{
            background-color: chartreuse;
        }
        button{
            border: none;
            background-color: darkkhaki;
        }
        button:focus{
            background-color: red;
            color: white;
        }
        button:active{
            background-color: gold;
        }
        .down{
            display: none;
            background-color: pink;
        }
        .parent:focus-within .down{
            display: block;
        }
        #show{
            display: none;
        }
        .show:focus #show{
            display: block;
        }
        #close{
            display: none;
        }
        .display:focus #add{
            display: none;
        }
        .display:focus #close{
            display: block;
        }
        .child .shape:nth-child(1){
            background-color: green;
            width: 100px;
            height: 100px;
            border-radius: 80px 30px;
        }
        .child .shape:nth-child(2){
            background-color: rebeccapurple;
            width: 100px;
            height: 100px;
            border-radius: 40%;
        }
        .child .shape:nth-child(3){
            background-color: pink;
            width: 100px;
            height: 100px;
            border-radius: 20%;
        }
        .child .shape:nth-child(4){
            background-color: yellow;
            width: 100px;
            height: 100px;
            border-radius: 70px;
        }
        .child .shape:nth-child(5){
            background-color: yellow;
            width: 100px;
            height: 100px;
            border-radius: 10px;
        }
        .child .shape:nth-child(6){
            background-color: purple;
            width: 100px;
            height: 100px;
            border-radius: 50%;
        }
        .child .shape:nth-child(7){
            background-color: palevioletred;
            width: 100px;
            height: 100px;
            border-radius: 50% 30%;
        }
        .child .shape:nth-child(8){
            background-color: royalblue;
            width: 100px;
            height: 100px;
            border-radius: 70px 50px;
        }
        .child .shape:nth-child(9){
            background-color: rosybrown;
            width: 100px;
            height: 100px;
            border-radius: 30px;
        }
        .child .shape:nth-child(10){
            background-color: yellowgreen;
            width: 100px;
            height: 100px;
            border-radius: 20px 30px;
        }
        .drop p:first-child{
    background-color: pink;
 }
    </style>
</head>
<body>
    <a href="">visit</a>
    <div class="box"></div>
    <button>click me</button>
    <div class="parent">
        <input type="text">
        <div class="down">
            <p>am here</p>
            <p>am here</p>
            <p>am here</p>
            <p>am here</p>
        </div>
    </div>
    <button class="show">
        <div>What is your name?</div>
        <div id="show">Sekinah</div>
    </button>
    <button class="display">
        <span>What is you name?</span>
        <b id="close">close</b>
        <b id="add">add</b>
    </button>
    <div class="child">
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
        <div class="shape"></div>
    </div>
</body>
</html>
