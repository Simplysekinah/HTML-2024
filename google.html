    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            background: linear-gradient(lime,lightblue);
            padding: 15px;
        }
        nav{
            display: flex;
            justify-content: end;
            gap: 10px;
            align-items: center;
        }
        nav a{
            color: white;
            text-decoration: none;
        }
        nav a:hover{
            text-decoration: underline;
        }
        .parent{
            position: relative;
        }
        .parent button{
            background-color: transparent;
            border: none;
            color: whitesmoke;
            padding: 5px 8px;
            border-radius: 50%;
        }
        .main{
            border-radius: 50%;
            padding: 5px 7px;
        }
        .main button{
            background-color: blue;
            color: white;
            border: 0;
            border-radius: 50%;
            padding: 10px 12px;
        }
        .gog{
            background-color: black;
            color: white;
            padding: 4px;
            border-radius: 5px;
            width: 100px;
            visibility: hidden;
            position: absolute;
            left: 0;
            transition: all 1s linear 2s;
        }
        .parent:hover .gog{
            visibility: visible;
        }
        .parent:hover button{
            background-color: rgba(238, 231, 231, 0.58);
        }
        .main:hover{
            background-color: rgba(238, 231, 231, 0.58);
        }
        section{
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .image img{
            width: 400px;
        }
        .middle{
            background-color: white;
            padding: 8px;
            display: flex;
            align-items: center;
            position: relative;
            width: 500px;
            border-radius: 20px;
        }
        .middle input{
            width: 400px;
            background-color: transparent;
            border: none;
            outline: none;
            padding: 3px;
        }
        .circle{
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: chocolate;
        }
        #vert{
            padding: 0 0 0 45px;
            float: right;
            transition: all 1s linear 1s;
            visibility: hidden;
            position: relative;
        }
        #vert:hover button{
            background-color:  rgba(238, 231, 231, 0.58);
        }
        .vert{
            float: right;
        }
        #vert button{
            background-color: transparent;
            border: 0;
            padding: 0;
            border-radius: 50%;
        }
        .holder{
            padding: 12px 18px;
        }
        .holder:hover{
            background-color:  rgba(238, 231, 231, 0.58);
        }
        .holder:hover #vert{
            visibility: visible;
        }
        .down{
            display: flex;
            flex-wrap: wrap;
            width: 530px;
        }
        .top-vert{
            background-color: black;
            color: white;
            padding: 6px 0;
            border-radius: 5px;
            position: absolute;
            top: 0;
            left: -18px;
            width: 100px;
            height: 50px;
            text-align: center;
            display: none;
            transition: all 1s linear 1s;
        }
        #vert:focus-within .top-vert{
            display: block;
        }
        .top-vert div:hover{
            background-color:  rgba(238, 231, 231, 0.58);
        }
        .dropdown{
            width: 500px;
            height: 200px;
            background-color: white;
            position: absolute;
            left: 0;
            top: 40px;
            border-radius: 0 0 20px 20px;
            display: none;
        }
        .middle:focus-within{
            border-radius: 20px 20px 0 0;
        }
        .middle:focus-within .dropdown{
            display: block;
        }
    </style>
