<!DOCTYPE html>
<html>
    <head>
        <title>Signup</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div>
            <center style="background: linear-gradient(yellow, plum); width: 300px; margin: 50px auto; border-radius: 10px;">
                <h1>Sign Up</h1>
                <p style="color: rgba(0, 0, 0, 0.272);">Create your Account</p>
                <form >
                    <input type="text" placeholder="Username" style="border-radius: 15px; border: none; background-color: plum; outline: none; padding: 0 0 0 10px; margin: 10px 0 0 0;">
                    <br>
                    <input type="text" placeholder="Email" style="border-radius: 15px; border: none; background-color: plum; outline: none; padding: 0 0 0 10px; margin: 10px 0 0 0;">
                    <br>
                    <input type="password" placeholder="Password" style="border-radius: 15px; border: none; background-color: plum; outline: none; padding: 0 0 0 10px; margin: 10px 0 0 0;">
                    <br>
                    <input type="password" placeholder="Confirm-Password" style="border-radius: 15px; border: none; background-color: plum; outline: none; padding: 0 0 0 10px; margin: 10px 0 0 0;">
                </form>
                <button style="border: none; background-color: purple; color: white; width: 150px; border-radius: 15px; font-size: 12px; margin: 10px 0 0 0;">Signup</button>
                <p>Or</p>
                <button style="border: 1px solid purple; color: purple; border-radius: 15px; width: 150px; font-size: 10px;">Sign in with Google</button>
                <section style="padding: 10px 0;">
                    <span>Already have an Account?</span>
                    <a href="Signin.html">Login</a>
                </section>
            </center>
        </div>
    </body>
</html>
