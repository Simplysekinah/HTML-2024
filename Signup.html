<!DOCTYPE html>
<html>
    <head>
        <title>Sign up</title>
        <style>
            *{
                margin: 0;
                padding: 0;
            }
        </style>
    </head>
    <body>
        <div style="background: linear-gradient(purple, plum); width: 400px; margin: auto; padding: 10px; margin-top: 70px; border-radius: 15px; box-shadow: 20px 10px 20px plum;">
            <h1 style="display: flex; justify-content: center;">Sign up</h1>
            <p style="display: flex; justify-content: center;">Create your Account</p>
            <form style="display: flex; align-items: center; flex-direction: column; gap: 10px;">
                <input type="text" placeholder="Username" style="width: 230px; border-radius: 10px; padding: 10px 5px; border: 0; outline: 0;background-color: violet;">
                <input type="email" placeholder="Email" style="width: 230px; border-radius: 10px; padding: 10px 5px; border: 0; outline: 0; background-color: violet;">
                <input type="password" placeholder="password" style="width: 230px; border-radius: 10px; padding: 10px 5px; border: 0; outline: 0; background-color: violet;">
                <input type="password" placeholder="Confirm Password" style="width: 230px; border-radius: 10px; padding: 10px 5px; border: 0; outline: 0; background-color: violet;">
            </form>
            <div style="display: flex; align-items: center; justify-content: center;  margin: 10px 0 0 0;">

                <button style="background-color: darkorchid; width: 230px; border-radius: 20px; height: 50px; border: 0;">Sign up</button>
            </div>
            <p style="display: flex; align-items: center; justify-content: center; margin: 10px 0 0 0;">Or</p>
            <div style="display: flex; align-items: center; justify-content: center;  margin: 10px 0 0 0;">
                <button style="width: 230px; border-radius: 20px; height: 50px; border: 2px solid darkorchid; color: darkorchid; font-weight: bold;">Signin with Google</button>
            </div>
            
            <div style="display: flex; justify-content: center; margin: 10px 0 0 0; gap: 5px;">
                <p>Already have an Account?</p>
                <a href="">Login</a>
            </div>
        </div>
    </body>
</html>
