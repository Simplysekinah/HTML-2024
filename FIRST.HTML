<!DOCTYPE html>
<html>

<head>
    <title>first-class</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .div1 {
            background-color: red;
            color: white;
        }

        #div1 {
            background-color: rebeccapurple;
            color: white;
        }

        #first-p,
        #first {
            color: red;
        }

        #first {
            font-size: 20px;
        }
        .box{
             background-color: red;
             width: 200px;
             height: 200px;
             padding: 10px;
        }
    </style>
</head>

<body>
    <!-- block level element and inline level element -->
    <!-- block level element -->
    <!-- heading tags h1-h6 h1 tag is the biggest tag in html -->
    <!-- container tags-div,section,nav,footer,main aside,header -->
    <!-- inline level element -->
    <!-- strong,span,a,b,i -->
    <!-- form -->
    <input type="text">
    <input type="button" value="click me">
    <button>Click me</button>
    <strong>gweuohdoqwej2</strong>

    <!-- inline,internal,external -->
    <span style="color: red; background-color: rebeccapurple;">My name is Emmanuel</span>
    <span></span>
    <!-- selectors-simple,combinator,psuedoclass,psuedo element,attribute -->
    <div class="div1">Emmanuel</div>
    <div id="div1">Emmanuel</div>
    <p id="first-p">hi</p>
    <p id="first">hello</p>
    <p id="first-p">how are you?</p>
    <div class="box">sekinat</div>
    <!-- multimedia tags -->
     <img src="" alt="picture">
     <audio src=""></audio>
     <video src=""></video>
     <iframe src="" frameborder="0"></iframe>
     <iframe width="100%" height="480" src="https://www.youtube.com/embed/_XY0VLAJQHU" title="Rescue Knight Rubble &amp; PAW Patrol Save the Kingdom! w/ Marshall | 1 Hour Compilation | Rubble &amp; Crew" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>

</html>
