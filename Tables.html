<!DOCTYPE html>
<html>
    <head>
        <title>table</title>
        <style>
            table,th,td{
                /* border-width: 1px;
                border-style: solid;
                border-color: black; */
                border: 1px solid black;
                border-collapse: collapse;
                padding: 5px;
                text-align: center;
            }
        </style>
    </head>
    <body>
        <table>
            <thead>
                <tr>
                    <th>S/N</th>
                    <th>Name</th>
                    <th>C. of cloth</th>
                    <th>Gender</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>1</td>
                    <td>sekinat</td>
                    <td>grey</td>
                    <td>female</td>
                </tr>
            </tbody>
        </table>
    </body>
</html>
