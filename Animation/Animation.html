<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animation</title>
    <style>
        .anim{
            background-color: cornflowerblue;
            width: 250px;
            height: 250px;
            animation-name: move;
            animation-delay: 2s;
            animation-duration: 5s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        .image{
            /* background-color: cornflowerblue; */
            width: 350px;
            height: 350px;
            animation-name: show;
            animation-delay: 2s;
            animation-duration: 5s;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }
        @keyframes move {
            10%{
                width: 300px;
                border-radius: 10px 120px 40px 180px;
                transform: rotate(80deg);
            }
            20%{
                height: 300px;
                border-radius: 180px;
                transform: translate(80deg); 
            }
            30%{
                margin: auto;
                transition: all 1s ease;
            }
            40%{
                box-shadow: 20px 50px 10px rgba(0, 0, 255, 0.4);
                height: 200px;
            }
            50%{
                margin: 40px 10px;
            }
            60%{
                box-shadow: inset 30px 0 0 0 bisque;
            }
            70%{
                padding: 10px 50px;
            }
            80%{
                width: 400px;
                height: 400px;
                transform: scale(1.5);
            }
            90%{
                transform: skew(60deg);
                border-radius: 50%;
                background: linear-gradient(Olive,green );
            }
            100%{
                border-radius: 100%;
                transform: rotate(270deg);
                background: linear-gradient(red, blue);
            }
        }
        @keyframes show {
            10%{
                width: 300px;
                border-radius: 10px 120px 40px 180px;
                transform: rotate(80deg);
                background: linear-gradient(red, yellow);
            }
            20%{
                height: 300px;
                border-radius: 180px;
                transform: translate(80deg); 
            }
            30%{
                margin: auto;
                transition: all 1s ease;
            }
            40%{
                box-shadow: 20px 50px 10px rgba(0, 0, 255, 0.4);
                height: 200px;
            }
            50%{
                margin: 40px 10px;
            }
            60%{
                box-shadow: inset 30px 0 0 0 bisque;
            }
            70%{
                padding: 10px 50px;
            }
            80%{
                width: 400px;
                height: 400px;
                transform: scale(1.5);
            }
            90%{
                transform: skew(60deg);
                border-radius: 50%;
                background: linear-gradient(Olive,green );
            }
            100%{
                border-radius: 100%;
                transform: rotate(270deg);
                background: linear-gradient(red, blue);
            }
        }
    </style>
</head>
<body>
    <div>Animation</div>
    <div class="anim"></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <img src="main-google.png" class="image" alt="">
</body>
</html>
