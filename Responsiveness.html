<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .master{
            background-color: red;
            width: 100%;
            height: 100vh;
        }
        .section1{
            padding: 10px 150px;
            width: 100%;
            height: 600px;
            background-color: yellow;
        }
        nav{
            background-color: brown;
            width: 100%;
            height: 50px;
        }
        .middle{
            background-color: blue;
            width: 70%;
            height: 150px;
            margin: 120px auto;
        }





        /* Media Query */
        @media (max-width: 1029.33px) {
            .section1{
                padding: 10px 50px;
            }
        }
        @media (max-width: 959.33px) {
            .section1{
                height: 450px;
            }
        }
    </style>
</head>
<body>
    <div class="master">
        <section class="section1">
            <nav></nav>
            <div class="middle"></div>
        </section>
    </div>
</body>
</html>
