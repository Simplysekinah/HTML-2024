<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="margin: 0; padding: 0; height: 100vh; ">
    <div style="background: linear-gradient(orangered,orange); width: 100vw; height: 100vh; display: grid; place-items: center;">
        <form action="" style="background-color: whitesmoke; width: 350px; padding: 7px; height: 350px; border-radius: 10px; text-align: center;">
            <h1>Sign Up</h1>
            <input type="email" placeholder="Email" style="width: 250px; border: 2px solid grey; border-radius: 5px; padding: 6px;">
            <br>
            <input type="password" placeholder="Create Password" style="width: 250px; border: 2px solid grey; border-radius: 5px; padding: 6px; margin: 10px 0 0 0;">
            <br>
            <input type="password" placeholder="Confirm Password" style="width: 250px; border: 2px solid grey; border-radius: 5px; padding: 6px; margin: 10px 0 0 0;">
            <br>
            <button style="width: 250px; background-color: rgb(0, 21, 255); border: none; padding: 6px; border-radius: 5px; color: white; margin: 10px 0 0 0;">
                <a href="" style="color: white; text-decoration: none;">Sign Up</a>
            </button>
            <div>
                <span style="font-size: 12px;">Already have an account?</span>
                <a href="" style="font-size: 12px;">Login</a>
            </div>
            <div style="display: flex; align-items: center;">
                <hr  style="width: 100px; text-align: right;">
                <span>Or</span>
                <hr style="width: 100px;">
            </div>
            <button style="padding: 5px;">
                <span style="background-color: white; padding: 5px 8px; border-radius: 100%; color: blue; font-weight: bold;">F</span>
                <span>Login with Facebook</span>
            </button>
            <div style="margin: 10px 0 0 0;">
                <span>G</span>
                <span>Login with Google</span>
            </div>
        </form>
    </div>

    <div style="background-color: green;">div2</div>
    <div style="background-color: yellow; font-size: 10px;">div2</div> -->
</body>
</html>
