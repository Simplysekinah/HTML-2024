<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            background: linear-gradient(red, yellow);
            animation-name: move;
            animation-duration: 1s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
            animation-fill-mode: backwards;
            transition: all 1s linear;
        }

        @keyframes move {
            to {
                background: linear-gradient(plum, gold);
            }

            from {
                background: linear-gradient(pink, brown);
            }
        }

        div {
            width: 500px;
            height: 500px;
            background-color: rosybrown;
            margin: auto;
            animation-name: down;
            animation-duration: 1s;
            animation-delay: 1s;
            animation-iteration-count: infinite;
            animation-direction: alternate-reverse;
            animation-fill-mode: backwards;
            transition: all 1s linear;
        }

        @keyframes down {
            0% {
                width: 200px;
                height: 200px;
                border-radius: 10%;
                background-color: cornflowerblue;
            }

            15% {
                box-shadow: inset red;
                background: linear-gradient(pink, plum);
                margin: 10px auto;
            }

            25% {
                box-shadow: inset wheat;
                background: linear-gradient(yellow, plum);
                margin: 10px auto;
                border-radius: 30%;
            }

            35% {
                box-shadow: inset gold;
                background: linear-gradient(purple, plum);
                margin: 10px auto;
                width: 300px;
                height: 300px;
            }

            45% {
                box-shadow: inset palevioletred;
                background: linear-gradient(green, yellowgreen);
                margin: 10px auto;
                transform: scale(1.5);
            }

            55% {
                box-shadow: inset yellow;
                background: linear-gradient(pink, plum);
                margin: 10px auto;
            }

            65% {
                box-shadow: inset red;
                background: linear-gradient(red, green);
                margin: 10px auto;
                border-radius: 100%;
            }

            75% {
                box-shadow: inset gold;
                background: linear-gradient(rgb(255, 192, 239), plum);
                margin: 10px auto;
                transform: rotate(150deg);
            }

            85% {
                box-shadow: inset goldenrod;
                margin: 10px auto;
                transform: scale(1.8);
            }

            95% {
                box-shadow: inset greenyellow;
                background: linear-gradient(pink, goldenrod);
                margin: 10px auto;
                border-radius: 30%;
                transform: translate(100px);
            }

            100% {
                box-shadow: inset yellowgreen;
                transform: rotate(300deg);
                background-repeat: no-repeat;
                margin: 10px auto;
                width: 500px;
                height: 500px;
            }
        }
    </style>
</head>

<body>
    <div>

    </div>
</body>

</html>
