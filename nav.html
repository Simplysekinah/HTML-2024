<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>nav</title>
    <style>
        .btn{
            display: flex;
            align-items:center;
            justify-content: right;
        }
        .show{
            background-color: aqua;
            width: 300px;
            height: 100vh;
            position: fixed;
            top: 0;
            right: -100%;
        }
        .showing:focus-within .show{
            right: 0;
            transition: all 2s 2s;
        }
        .anim{
            background-color: red;
            color: white;
            width: 300px;
            font-size: 20px;
            animation-name: move;
            animation-duration: 5s;
            animation-delay: 2s;
            animation-iteration-count: 2;
            /* animation-fill-mode: backwards; */
        }
        @keyframes move {
            20%{
                width: 200px;
                border-radius: 20px;
                background: linear-gradient(blue, yellow);
            }
            40%{
                width: 250px;
                border-radius: 10px;
                background: linear-gradient(red, yellow);
            }
            80%{
                width: 150px;
                border-radius: 20px;
                background: linear-gradient(pink, yellow);
            }
        }
    </style>
</head>
<body>
    <div>
        <nav>
            <div class="showing">
                <div class="btn">
                    <button>o</button>
                </div>
                <div class="show">
                    <div>Personal</div>
                    <div>Business</div>
                    <div>Developer</div>
                </div>
            </div>
        </nav>
        <div>
            <div class="anim">Lorem ipsum dolor sit amet.</div>
        </div>
    </div>
</body>
</html>
