<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1::first-letter{
            color: red;
            font-size: 30px;
        }
        .line::first-line{
            background-color: yellow;
            color: white;
        }
        ::marker{
            color: red;
            font-size: 40px;
        }
        h5::before{
            content: "Danjuma ";
        }
        h5::after{
            content: " Sodiq ";
        }
        h5::before{
            content: url(../../Downloads/Frame\ 100.png);
        }
        /* Tranform */
        .trans{
            width: 200px;
            height: 200px;
            background-color: blueviolet;
            transition: all 2s linear;
        }
        .trans:hover{
            transform: translate(30px, 20px);

        }
        .scale{
            width: 200px;
            height: 200px;
            background-color: blue;
            transition: all 2s linear;
        }
        .scale:hover{
            transform: scale(0.5);
        }
        .skew{
            width: 200px;
            height: 200px;
            background-color: red;
            transition: all 2s linear;
        }
        .skew:hover{
            transform: skew(30deg);
        }
        .move{
            background-color: palegoldenrod;
            width: 400px;
            height: 400px;
            /* border-radius: 50%; */
            transition: all 5s ease-out;
        }
        .move:hover{
            transform: rotate(45deg);
        }
    </style>
</head>
<body>
    <div>
        <h1>Lorem ipsum dolor sit amet consectetur.</h1>
        <div class="line">
            <h2>Lorem ipsum dolor sit amet.</h2>
            <h2>Lorem ipsum dolor sit amet.</h2>
            <h2>Lorem ipsum dolor sit amet.</h2>
            <h2>Lorem ipsum dolor sit amet.</h2>
            <h2>Lorem ipsum dolor sit amet.</h2>
        </div>
        <ul>
            <li>items</li>
            <li>items</li>
            <li>items</li>
            <li>items</li>
            <li>items</li>
        </ul>
        <h5>Hero</h5>
        <div class="trans"></div>
        <div class="scale"></div>
        <div class="skew"></div>
        <div class="move"></div>
    </div>
</body>
</html>
