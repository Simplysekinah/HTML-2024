<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://kit.fontawesome.com/81f35a7969.js" crossorigin="anonymous"></script>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        main{
            background-color: chartreuse;
            display: flex;
            padding: 20px;
            gap: 20px;
        }
        .one,.two{
            width: 300px;
            height: 400px;
            background-color: black;
        }
        .section{
            background-color: #225577;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .holder{
            background-color: chocolate;
            height: 60px;
        }
        .holder span{
            display: block;
        }
        .about{
            display: flex;
            align-items: center;
        }
        .about div{
            font-size: 30px;
        }
    </style>
</head>
<body>
    <main>
        <div class="one"></div>
        <div class="one"></div>
        <div class="one"></div>
    </main>
    <div class="section">
        <div class="two"></div>
        <div class="two"></div>
        <div class="two"></div>
    </div>
    <div class="about">
        <div>About</div>
        <i class="fa-solid fa-angle-down"></i>
    </div>
    <div class="holder">
        <span>Sekinat</span>
        <span>Sekinat</span>
        <span>Sekinat</span>
        <span>Sekinat</span>
        <span>Sekinat</span>
    </div>
    <div>
        <span>sqi</span>
        <span>sqi</span>
        <span>sqi</span>
        <span>sqi</span>
        <span>sqi</span>
        <span>sqi</span>
    </div>
</body>
</html>
