<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body{
            width: 100%;
            height: 100vh;
        }
        section{
            background-color: rgba(0, 0, 0, 0.395);
            height: 500px;
        }
        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
        }
        .middle{
            background-color: red;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 30px;
            /* width: 500px;
            height: 300px; */
        }
        h1{
            font-size: 52px;
            /* min-width: 120px; */
            font-family: sans-serif;
            text-align: center;
        }








        /* Media Query */
        @media (max-width: 1024px) {
            h1{
                font-size: 52px;
            }
            .p2{
                font-size: 22px;
            }
        }
        @media (max-width:959px) {
            h1{
                font-size: 35.5px;
            }
        }
        @media (max-width:873.33px) {
            .p2{
                font-size: 17px;
                width: 500px;
                text-align: center;
            }
        }

        @media (max-width:498px) {
            h1{
                width: 380px;
            }
        }
        @media (max-width:387.33px) {
            h1{
                width: 260px;
                font-size: 26px;
            }
        }

    </style>
</head>
<body>
    <div class="master">
        <section>
            <nav>
                <div>
                    <img src="netflix_logo-removebg-preview.png" alt="">
                </div>
                <button>Signin</button>
            </nav>
            <div class="middle">
                <h1>Unlimited movies, TV shows, and more</h1>
                <p>Watch anywhere. Cancel anytime.</p>
                <p class="p2">Ready to watch? Enter your email or mobile number to create or restart your membership.</p>
                <div>
                    <input type="text" placeholder="Email Address">
                    <button>Get Started</button>
                </div>
            </div>
        </section>
    </div>
</body>
</html>
