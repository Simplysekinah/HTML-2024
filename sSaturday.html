<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .sqi{
            border: 2px solid green;
            /* outline-width: 2px;
            outline-style: double;
            outline-color: crimson; */
            outline: 2px double crimson;
            outline-offset: 10px;
            margin: 30px 0;
        }
        .start, .center, .end{
            color: brown;
            background-color: burlywood;
            padding: 5px;
            width: 150px;
            margin: 10px 0;
        }
        .starts{
            text-align: start;
        }
        .centers{
            text-align: center;
        }
        .ends{
            text-align: end;
        }
        .one{
            text-decoration: underline;
            text-transform: lowercase;
        }
        .two{
            text-decoration: line-through;
        }
        .three{
            text-decoration: overline;
            text-shadow: 5px 5px 5px goldenrod;
        }
    </style>
</head>
<body>
    <!-- outline -->
    <div class="sqi">sqi</div>
    <!-- text formatting -->
     <!-- text-align(start,center,end) -->
    <div class="start starts">START</div>
    <div class="center centers">CENTER</div>
    <div class="end ends">END</div>
    <div class="one">ONE</div>
    <div class="two">TWO</div>
    <div class="three">THREE</div>
    <div class="div">SQI</div>
</body>
</html>
