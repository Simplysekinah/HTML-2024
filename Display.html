            width: 500px;
        }
        .beside{
            display: flex;
            justify-content: space-between;
        }
        .drop{
            display: none;
        }
        #btn:focus .drop{

        }
        .box{
            width: 100px;

            background-color: red;
        }
        .parent{
            display: flex;
            gap: 10px;
            width: 300px;
            height: 500px;

            align-items: center;
            justify-content: center;
        }
        .container{
            width: 500px;
            height: 250px;
            background-color: dodgerblue;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .square{
            background-color: orangered;
            width: 100px;
            height: 100px;
        }
        .holder{
            background-color: palegreen;
            display: flex;
            justify-content: space-evenly;
        }
        .first,.second,.third{

            width: 300px;
            height: 400px;
        }
        .break h1{

        }
        .wrap{
            width: 500px;
            background-color: burlywood;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        .shape{
            width: 100px;
            height: 100px;
            background-color: chocolate;
        }
        .wraps{
            width: 500px;
            background-color: burlywood;
            display: flex;
            gap: 10px;
            overflow: auto;
        }
        .shapes{

        .scroll{

            display: flex;

            overflow: auto;
            /* flex-direction: column; */
            flex-wrap: wrap;
            height: 300px;
        }
        .shap{
            width: 100px;
            height: 100px;
            background-color: chocolate;
        }
    </style>
</head>
