<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Document</title>
        <style>
            /* tagname */
            div{
                width: 200px;
                height: 200px;
                background-color: brown;
            }
            /* classname */
            .container{
                width: 200px;
                height: 200px;
                background-color: green;
                border-radius: 50%;
            }
            /* idname */
            #container{
                width: 200px;
                height: 200px;
                background-color: yellowgreen;
                border-radius: 50% 20%;
            }
            .combine,#combine{
                background-color: red;
                width: 250px;
                height: 250px;
                border-radius: 30% 60%;
            }
        </style>
    </head>
    <body>
        <!-- Selectors -->
        <!-- simple,combinator,attribute,psuedoclass,psuedoelement -->
        <!-- simple-tagname,classname,idname -->
        <!-- tagname-the name the tag bears -->
        <div></div>
        <div class="container"></div>
        <div id="container"></div>
        <div class="combine"></div>
        <div id="combine"></div>
        <!-- in-line,internal &external styling -->
         <!-- favicon -->
          <!-- comment -->
    </body>
</html>
