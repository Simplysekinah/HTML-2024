        .overY{

            height: 400px;

            background-color: firebrick;
            display: flex;
            overflow-y: scroll;
        }
        .overY div{
            min-width: 200px;
            height: 200px;
            background-color: green;
            margin: 2px;
        }
        .overY::-webkit-scrollbar{
            /* display: none; */
            background-color: transparent;
            width: 5px;
        }
        .overY::-webkit-scrollbar-thumb{
            background-color: chartreuse;
            border-radius: 20px;
        }
    </style>
