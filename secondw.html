<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div{
            background-color: blue;
            width: 200px;
            height: 200px;
        }
        .first-div{
            background-color: yellow;
            width: 150px;
            height: 150px;
        }
        .second-div{
            background-color: burlywood;
            width: 500px;
            height: 200px;
        }
        #first-div{
            background-color: rebeccapurple;
            width: 200px;
            height: 200px;
        }
        .first_p{
            background-color: red;
            color: white;
            width: 250px;
            height: 50px;
            padding: 0 0 0 10px;
        }
        .combine,.addme{
            background-color: orangered;
            width: 250px;
            height: 50px;
        }
        .addme{
            background-color: olivedrab;
            /* margin: 10px; */
            /* margin: 20px 30px; */
            /* margin: 10px 20px 30px 40px; */
            margin: 10px 0 0 0;
        }
    </style>
</head>
<body>
    <!-- simple selector -->
    <div></div>
    <div class="first-div"></div>
    <div class="second-div"></div>
    <div id="first-div"></div>
    <p class="first_p">Welcome to css</p>
    <!-- combinator selector -->
     <div class="combine"></div>
     <div class="addme"></div>
     <!-- margin with a single value will affects all the sides -->
     <!-- margin with a two value will affects- first value-top$bottom second value-left and right -->
     <!-- margin with a four value will affects- top,right,bottom,left -->
</body>
</html>
